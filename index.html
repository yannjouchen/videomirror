<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影片鏡像台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方一條細操作列，其餘整個視窗都是鏡像播放區 */
:root{
  --bar:#161b22; --fg:#e8edf2; --muted:#9aa7b4; --line:#2c3540;
  --accent:#3d8bfd; --accent-fg:#ffffff; --stage:#000000; --err:#ff7b72;
  --sans:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font:15px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{margin:0 6px 0 0;font-size:1rem;font-weight:700;white-space:nowrap}
input[type=url]{flex:1 1 240px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#0d1117;color:var(--fg);font:inherit}
button,.filebtn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--fg);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{display:none}
button.off{opacity:.4;cursor:not-allowed}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;max-width:calc(100% - 32px);padding:8px 14px;border-radius:8px;background:rgba(22,27,34,.9);color:var(--fg);font-size:.9rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.toast.err{color:var(--err)}
.shape{display:none;gap:0}
.shape.on{display:inline-flex}
.shape button{border-radius:0}
.shape button:first-child{border-radius:8px 0 0 8px}
.shape button:last-child{border-radius:0 8px 8px 0;border-left:0}
.shape button[aria-pressed=true]{background:#30363d;color:#fff;border-color:#57606a}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--stage)}
.view{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.flip{transform:scaleX(-1);display:grid;place-items:center;width:100%;height:100%}
.flip.off{transform:none}
.view iframe{border:0;display:block;background:#000}
.view video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.empty{color:#6e7b88;text-align:center;padding:24px}
.flip:not(.off) .empty{transform:scaleX(-1)}
.stage.big{position:fixed;inset:0;z-index:50}
.stage:fullscreen{width:100vw;height:100vh}
.stage:-webkit-full-screen{width:100vw;height:100vh}
/* 點畫面播放／暫停的透明層；留出「略過廣告」按鈕所在的角落（鏡像時在左下，正常時在右下），讓它能被點到 */
.tap{position:absolute;inset:0;z-index:1;cursor:pointer;-webkit-tap-highlight-color:transparent;clip-path:polygon(0 0,100% 0,100% 100%,45% 100%,45% 72%,0 72%)}
.tap.normal{clip-path:polygon(0 0,100% 0,100% 72%,55% 72%,55% 100%,0 100%)}
.tap .cover{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(#000 55%,transparent);opacity:0;transition:opacity .2s}
.tap .big-play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.tap .big-play svg{width:34px;height:34px;fill:#fff;margin-left:4px}
.tap.paused .big-play,.tap.paused.mirrored .cover{opacity:1}
/* 操作列在影片下方，不蓋住影片 */
.ctl{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar);border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ctl button,.ctl select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:#fff;font:inherit;font-size:.9rem}
.ctl .icon{width:40px;height:36px;padding:0;display:grid;place-items:center}
.ctl .icon svg{width:20px;height:20px;fill:#fff}
.ytonly{display:flex;align-items:center;gap:8px 10px;flex:1 1 320px;min-width:0}
.ytonly[hidden]{display:none!important}
.ctl input[type=range]{flex:1;min-width:80px;accent-color:#ff3b30;height:28px}
.ctl .time{color:#dfe5ea;font-size:.85rem;white-space:nowrap}
.ctl .right{display:flex;gap:8px;margin-left:auto}
#mirror[aria-pressed=false]{background:#5a3b12;border-color:#b7791f}
@media (max-width:520px){.bar h1{display:none}.ctl{padding-inline:10px}.ctl .time .dur{display:none}}
</style>
</head>
<body>
<header class="bar">
  <h1>影片鏡像台</h1>
  <input id="url" type="url" placeholder="貼上臉書或 YouTube 影片網址，按 Enter">
  <button id="load" class="primary">載入</button>
  <span class="shape" id="shape" role="group" aria-label="影片形狀">
    <button id="land" aria-pressed="true">橫式</button>
    <button id="port" aria-pressed="false">直式</button>
  </span>
  <label class="filebtn">本機影片<input id="file" type="file" accept="video/*"></label>
  <button id="share" class="off" aria-disabled="true">分享連結</button>
</header>

<main class="stage" id="stage">
  <div class="view" id="view">
    <div class="flip" id="flip">
      <div class="empty">貼上臉書／YouTube 網址，或選擇本機影片</div>
    </div>
    <div class="tap paused mirrored" id="tap" hidden>
      <div class="cover"></div>
      <div class="big-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="toast" id="msg" role="status" aria-live="polite"></div>
  </div>
  <div class="ctl">
    <span class="ytonly" id="ytbar" hidden>
      <button class="icon" id="ytplay" aria-label="播放"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <span class="time"><span id="ytcur">0:00</span><span class="dur"> / <span id="ytdur">0:00</span></span></span>
      <input type="range" id="ytseek" min="0" max="1000" value="0" aria-label="播放進度">
      <button class="icon" id="ytmute" aria-label="靜音"></button>
      <select id="ytspeed" aria-label="播放速度">
        <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
        <option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
      </select>
    </span>
    <span class="right">
      <button id="mirror" aria-pressed="true">暫停鏡像</button>
      <button id="zoom" aria-label="全螢幕">⤢ 全螢幕</button>
    </span>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const flip=$('flip'), msg=$('msg'), stage=$('stage'), view=$('view'), zoom=$('zoom');
let fbUrl=null, ytId=null, ytStart=0, portrait=false, objUrl=null;

/* 短暫提示，幾秒後自動消失 */
let tt;
function say(t,err){
  msg.textContent=t;msg.className='toast show'+(err?' err':'');
  clearTimeout(tt);tt=setTimeout(()=>msg.classList.remove('show'),err?4000:2500);
}
function clearStage(){
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
  ytTeardown();
  flip.innerHTML='';fbUrl=null;ytId=null;ytStart=0;
  setShare(false);
}
function setShare(on){
  $('share').classList.toggle('off',!on);
  $('share').setAttribute('aria-disabled',!on);
}

/* 依播放區大小，放一個最大的橫式或直式臉書播放器 */
function buildFrame(){
  if(ytId){
    if(ytPlayer&&ytPlayer.setSize)ytPlayer.setSize(view.clientWidth,view.clientHeight);
    return;
  }
  if(!fbUrl)return;
  const W=view.clientWidth, H=view.clientHeight, r=portrait?16/9:9/16; /* r = 高/寬 */
  let w=W, h=Math.round(W*r);
  if(h>H){h=H;w=Math.round(H/r)}
  let f=flip.querySelector('iframe');
  const src='https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(fbUrl)+'&show_text=false&width='+w+'&height='+h;
  if(!f){
    f=document.createElement('iframe');
    /* 不開放臉書自己的全螢幕，全螢幕時才不會失去鏡像 */
    f.allow='autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share';
    flip.appendChild(f);
  }
  if(f.width==w&&f.height==h)return;
  f.width=w;f.height=h;f.src=src;
}

function loadFb(raw,startPortrait){
  let u=(raw||'').trim();
  if(!u){say('請先貼上網址',true);return}
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  let host;
  try{host=new URL(u).hostname}catch{say('網址格式不對，請確認後再貼一次',true);return}
  if(/(^|\.)(youtube\.com|youtu\.be|youtube-nocookie\.com)$/i.test(host)){loadYt(u);return}
  if(!/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/i.test(host)){say('請貼上臉書或 YouTube 的影片網址',true);return}
  clearStage();
  fbUrl=u;
  $('url').value=u;
  setShape(!!startPortrait); /* 預設橫式；影片若是直的，按「直式」 */
  $('shape').classList.add('on');
  say('已載入並鏡像');
}

/* YouTube：支援 watch?v=、youtu.be/、/shorts/、/embed/、/live/，以及 t= 開始時間 */
function ytParse(u){
  let x;try{x=new URL(u)}catch{return null}
  let id=null;
  if(/youtu\.be$/i.test(x.hostname))id=x.pathname.slice(1).split('/')[0];
  else if(x.searchParams.get('v'))id=x.searchParams.get('v');
  else{const m=x.pathname.match(/\/(shorts|embed|live|v)\/([^/?#]+)/);if(m)id=m[2]}
  if(!id||!/^[\w-]{6,20}$/.test(id))return null;
  const t=x.searchParams.get('t')||x.searchParams.get('start')||'';
  let sec=0;
  if(/^\d+$/.test(t))sec=+t;
  else{const m=t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);if(m)sec=(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)}
  return{id,sec};
}
function loadYt(u){
  const r=ytParse(u);
  if(!r){say('找不到這個 YouTube 影片，請確認網址',true);return}
  clearStage();
  ytId=r.id;ytStart=r.sec;
  $('ytspeed').value='1';
  $('url').value=u;
  $('shape').classList.remove('on'); /* YouTube 會自己調整比例，不需要橫式／直式 */
  ytCreate();
  srcForShare=u;
  saveToAddress();
  say('已載入並鏡像');
}
let srcForShare=null;

/* ===== YouTube：只鏡像畫面，YouTube 自己的按鈕全部隱藏，改用下方不鏡像的操作列 ===== */
let ytPlayer=null, ytTimer=null, ytSeeking=false, ytApi=null;
const ICON={
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.6 3-2.8-2.8-1.4 1.4 2.8 2.8-2.8 2.8 1.4 1.4 2.8-2.8 2.8 2.8 1.4-1.4-2.8-2.8 2.8-2.8-1.4-1.4z"/></svg>'
};
function loadYtApi(){
  if(ytApi)return ytApi;
  ytApi=new Promise(res=>{
    if(window.YT&&YT.Player)return res();
    window.onYouTubeIframeAPIReady=()=>res();
    const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';
    sc.onerror=()=>{ytApi=null;say('無法連上 YouTube，請檢查網路後再試',true)};
    document.head.appendChild(sc);
  });
  return ytApi;
}
function fmt(t){t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=String(t%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x}
async function ytCreate(){
  const id=ytId,start=ytStart;
  await loadYtApi();
  if(id!==ytId)return; /* 等待期間換了影片 */
  const holder=document.createElement('div');flip.appendChild(holder);
  ytPlayer=new YT.Player(holder,{
    width:view.clientWidth,height:view.clientHeight,videoId:id,
    host:'https://www.youtube.com',
    playerVars:{controls:0,disablekb:1,fs:0,rel:0,playsinline:1,iv_load_policy:3,modestbranding:1,start:start||0,origin:location.origin},
    events:{
      onReady:()=>{ytShowUi(true);ytSync();ytTimer=setInterval(ytSync,250)},
      onStateChange:e=>{
        if(e.data===YT.PlayerState.ENDED){ytPlayer.seekTo(0,true);ytPlayer.pauseVideo()} /* 避免結尾出現推薦影片 */
        ytSync();
      },
      onError:e=>{say(e.data===101||e.data===150?'這支影片的上傳者不允許嵌入播放':'YouTube 無法播放這支影片',true)}
    }
  });
}
function ytShowUi(on){
  $('tap').hidden=!on;$('ytbar').hidden=!on;
}
function ytTeardown(){
  clearInterval(ytTimer);ytTimer=null;
  if(ytPlayer&&ytPlayer.destroy){try{ytPlayer.destroy()}catch{}}
  ytPlayer=null;ytShowUi(false);
}
function ytPlaying(){return ytPlayer&&ytPlayer.getPlayerState&&ytPlayer.getPlayerState()===YT.PlayerState.PLAYING}
function ytSync(){
  if(!ytPlayer||!ytPlayer.getDuration)return;
  const d=ytPlayer.getDuration()||0,c=ytPlayer.getCurrentTime()||0,p=ytPlaying();
  $('ytdur').textContent=fmt(d);
  if(!ytSeeking){$('ytcur').textContent=fmt(c);$('ytseek').value=d?Math.round(c/d*1000):0}
  $('ytplay').innerHTML=p?ICON.pause:ICON.play;
  $('ytplay').setAttribute('aria-label',p?'暫停':'播放');
  $('tap').classList.toggle('paused',!p);
  const m=ytPlayer.isMuted();
  $('ytmute').innerHTML=m?ICON.mute:ICON.vol;
  $('ytmute').setAttribute('aria-label',m?'取消靜音':'靜音');
}
function ytToggle(){if(!ytPlayer)return;ytPlaying()?ytPlayer.pauseVideo():ytPlayer.playVideo();setTimeout(ytSync,80)}
$('tap').onclick=ytToggle;

/* 暫停鏡像：想看字幕或原本文字時，畫面暫時轉回正常方向 */
let mirrored=true;
$('mirror').onclick=()=>{
  mirrored=!mirrored;
  flip.classList.toggle('off',!mirrored);
  $('tap').classList.toggle('mirrored',mirrored);
  $('tap').classList.toggle('normal',!mirrored);
  $('mirror').setAttribute('aria-pressed',mirrored);
  $('mirror').textContent=mirrored?'暫停鏡像':'恢復鏡像';
  say(mirrored?'已恢復鏡像':'已暫停鏡像，畫面為正常方向');
};
$('ytplay').onclick=ytToggle;
$('ytmute').onclick=()=>{if(!ytPlayer)return;ytPlayer.isMuted()?ytPlayer.unMute():ytPlayer.mute();setTimeout(ytSync,80)};
$('ytspeed').onchange=e=>{if(ytPlayer)ytPlayer.setPlaybackRate(+e.target.value)};
$('ytseek').oninput=e=>{ytSeeking=true;const d=ytPlayer?ytPlayer.getDuration():0;$('ytcur').textContent=fmt(d*e.target.value/1000)};
$('ytseek').onchange=e=>{if(ytPlayer)ytPlayer.seekTo(ytPlayer.getDuration()*e.target.value/1000,true);ytSeeking=false;setTimeout(ytSync,120)};


function setShape(p){
  portrait=p;
  $('land').setAttribute('aria-pressed',!p);
  $('port').setAttribute('aria-pressed',p);
  const f=flip.querySelector('iframe');if(f)f.remove();
  buildFrame();
  saveToAddress();
}

/* 把影片網址與橫直設定記在網頁網址上（?v=…&s=p），別人打開就會直接載入 */
function shareLink(){
  const base=location.href.split('#')[0].split('?')[0];
  if(ytId)return base+'?v='+encodeURIComponent(srcForShare);
  return base+'?v='+encodeURIComponent(fbUrl)+(portrait?'&s=p':'');
}
function saveToAddress(){
  if(!fbUrl&&!ytId)return;
  try{history.replaceState(null,'',shareLink())}catch{}
  setShare(true);
}
/* 分享：手機跳出分享選單；不支援時直接複製連結 */
function copyText(t){
  const ta=document.createElement('textarea');
  ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch{}
  ta.remove();return ok;
}
$('share').onclick=async()=>{
  if($('share').classList.contains('off')){
    say(objUrl?'本機影片只在你的裝置上播放，無法分享':'請先載入臉書或 YouTube 影片',true);return;
  }
  const link=shareLink();
  if(navigator.share&&/^https?:/.test(location.protocol)){
    try{await navigator.share({url:link});return}catch(e){if(e.name==='AbortError')return}
  }
  try{await navigator.clipboard.writeText(link);say('已複製分享連結')}
  catch{const ok=copyText(link);say(ok?'已複製分享連結':'無法自動複製，請直接複製瀏覽器網址列的網址',!ok)}
};
if(location.protocol==='file:')
  $('share').title='提醒：這個網頁目前是存在你電腦裡的檔案，要先放到網路上，別人才打得開分享連結';
$('land').onclick=()=>setShape(false);
$('port').onclick=()=>setShape(true);

$('load').onclick=()=>loadFb($('url').value);
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')loadFb($('url').value)});
document.addEventListener('paste',e=>{
  if(e.target===$('url'))return setTimeout(()=>loadFb($('url').value),0);
  const t=(e.clipboardData||window.clipboardData).getData('text');
  if(t){$('url').value=t;loadFb(t)}
});

$('file').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  clearStage();
  $('shape').classList.remove('on');
  objUrl=URL.createObjectURL(file);
  const vd=document.createElement('video');
  vd.src=objUrl;vd.controls=true;vd.playsInline=true;
  vd.setAttribute('playsinline','');vd.setAttribute('webkit-playsinline','');
  /* 關掉影片內建全螢幕，改用右下角按鈕，鏡像才不會消失 */
  vd.setAttribute('controlsList','nofullscreen');
  vd.disablePictureInPicture=true;
  flip.appendChild(vd);
  try{history.replaceState(null,'',location.href.split('?')[0])}catch{}
  say('已載入並鏡像');
};

/* 全螢幕：對整個播放區，鏡像會保留；iPhone 不支援時改成鋪滿整頁 */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const isBig=()=>fsEl()===stage||stage.classList.contains('big');
function updateZoom(){
  const b=isBig();
  zoom.textContent=b?'⤡ 離開全螢幕':'⤢ 全螢幕';
  zoom.setAttribute('aria-label',b?'離開全螢幕':'全螢幕');
  setTimeout(buildFrame,120);
}
zoom.onclick=()=>{
  if(isBig()){
    if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    stage.classList.remove('big');updateZoom();return;
  }
  const req=stage.requestFullscreen||stage.webkitRequestFullscreen;
  if(req)Promise.resolve(req.call(stage)).catch(()=>{stage.classList.add('big');updateZoom()});
  else{stage.classList.add('big');updateZoom()}
};
document.addEventListener('fullscreenchange',updateZoom);
document.addEventListener('webkitfullscreenchange',updateZoom);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('big')){stage.classList.remove('big');updateZoom()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(buildFrame,250)});

/* 從分享連結打開：自動載入影片 */
(function(){
  const q=new URLSearchParams(location.search);
  const v=q.get('v');
  if(v){
    loadFb(v,q.get('s')==='p');
  }
})();
</script>
</body>
</html>
