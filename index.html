<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影片鏡像台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方一條細操作列，其餘整個視窗都是鏡像播放區 */
:root{
  --bar:#161b22; --fg:#e8edf2; --muted:#9aa7b4; --line:#2c3540;
  --accent:#3d8bfd; --accent-fg:#ffffff; --stage:#000000; --err:#ff7b72;
  --sans:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font:15px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{margin:0 6px 0 0;font-size:1rem;font-weight:700;white-space:nowrap}
input[type=url]{flex:1 1 240px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#0d1117;color:var(--fg);font:inherit}
button,.filebtn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--fg);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{display:none}
.msg{flex-basis:100%;margin:0;color:var(--muted);font-size:.85rem}
.msg.err{color:var(--err)}
.sharebox{flex-basis:100%;display:flex;gap:8px}
.sharebox input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#0d1117;color:var(--fg);font:inherit;font-size:.85rem}
.shape{display:none;gap:0}
.shape.on{display:inline-flex}
.shape button{border-radius:0}
.shape button:first-child{border-radius:8px 0 0 8px}
.shape button:last-child{border-radius:0 8px 8px 0;border-left:0}
.shape button[aria-pressed=true]{background:#30363d;color:#fff;border-color:#57606a}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--stage)}
.flip{transform:scaleX(-1);display:grid;place-items:center;width:100%;height:100%}
.stage iframe{border:0;display:block;background:#000}
.stage video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.empty{transform:scaleX(-1);color:#6e7b88;text-align:center;padding:24px}
.zoom{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;background:rgba(22,27,34,.78);border-color:rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.stage.big{position:fixed;inset:0;z-index:50}
.stage:fullscreen{width:100vw;height:100vh}
.stage:-webkit-full-screen{width:100vw;height:100vh}
@media (max-width:520px){.bar h1{display:none}}
</style>
</head>
<body>
<header class="bar">
  <h1>影片鏡像台</h1>
  <input id="url" type="url" placeholder="貼上臉書影片網址，按 Enter">
  <button id="load" class="primary">載入</button>
  <span class="shape" id="shape" role="group" aria-label="影片形狀">
    <button id="land" aria-pressed="true">橫式</button>
    <button id="port" aria-pressed="false">直式</button>
  </span>
  <label class="filebtn">本機影片<input id="file" type="file" accept="video/*"></label>
  <button id="share" hidden>分享連結</button>
  <p id="msg" class="msg">在頁面任何地方按 Ctrl+V / ⌘V 也能直接貼上網址。影片會自動鏡像。</p>
  <div class="sharebox" id="sharebox" hidden>
    <input id="shareurl" type="text" readonly aria-label="分享連結">
    <button id="copy" class="primary">複製</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="flip" id="flip">
    <div class="empty">貼上網址或選擇本機影片，影片會鋪滿這裡</div>
  </div>
  <button class="zoom" id="zoom" aria-label="全螢幕">⤢ 全螢幕</button>
</main>

<script>
const $=id=>document.getElementById(id);
const flip=$('flip'), msg=$('msg'), stage=$('stage'), zoom=$('zoom');
let fbUrl=null, portrait=false, objUrl=null;

function say(t,err){msg.textContent=t;msg.className='msg'+(err?' err':'')}
function clearStage(){
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
  flip.innerHTML='';fbUrl=null;
  $('share').hidden=true;$('sharebox').hidden=true;
}

/* 依播放區大小，放一個最大的橫式或直式臉書播放器 */
function buildFrame(){
  if(!fbUrl)return;
  const W=stage.clientWidth, H=stage.clientHeight, r=portrait?16/9:9/16; /* r = 高/寬 */
  let w=W, h=Math.round(W*r);
  if(h>H){h=H;w=Math.round(H/r)}
  let f=flip.querySelector('iframe');
  const src='https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(fbUrl)+'&show_text=false&width='+w+'&height='+h;
  if(!f){
    f=document.createElement('iframe');
    /* 不開放臉書自己的全螢幕，全螢幕時才不會失去鏡像 */
    f.allow='autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share';
    flip.appendChild(f);
  }
  if(f.width==w&&f.height==h)return;
  f.width=w;f.height=h;f.src=src;
}

function loadFb(raw,startPortrait){
  let u=(raw||'').trim();
  if(!u){say('請先貼上網址',true);return}
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  let host;
  try{host=new URL(u).hostname}catch{say('網址格式不對，請確認後再貼一次',true);return}
  if(!/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/i.test(host)){say('這不是臉書網址',true);return}
  clearStage();
  fbUrl=u;
  $('url').value=u;
  setShape(!!startPortrait); /* 預設橫式；影片若是直的，按「直式」 */
  $('shape').classList.add('on');
  say('已載入並鏡像。如果畫面上下有很多黑邊，切換「橫式／直式」即可鋪滿。沒畫面的話，可能是影片非公開。');
}

function setShape(p){
  portrait=p;
  $('land').setAttribute('aria-pressed',!p);
  $('port').setAttribute('aria-pressed',p);
  const f=flip.querySelector('iframe');if(f)f.remove();
  buildFrame();
  saveToAddress();
}

/* 把影片網址與橫直設定記在網頁網址上（?v=…&s=p），別人打開就會直接載入 */
function shareLink(){
  const base=location.href.split('#')[0].split('?')[0];
  return base+'?v='+encodeURIComponent(fbUrl)+(portrait?'&s=p':'');
}
function saveToAddress(){
  if(!fbUrl)return;
  try{history.replaceState(null,'',shareLink())}catch{}
  $('share').hidden=false;
  $('shareurl').value=shareLink();
}
$('share').onclick=async()=>{
  const link=shareLink();
  if(navigator.share&&/^https?:/.test(location.protocol)){
    try{await navigator.share({title:'鏡像影片',url:link});return}catch(e){if(e.name==='AbortError')return}
  }
  $('shareurl').value=link;
  $('sharebox').hidden=!$('sharebox').hidden;
  if(!$('sharebox').hidden)$('shareurl').select();
};
$('copy').onclick=async()=>{
  const inp=$('shareurl');
  try{await navigator.clipboard.writeText(inp.value);say('已複製分享連結，貼給朋友就能直接看鏡像影片。')}
  catch{inp.focus();inp.select();say('請按 Ctrl+C / ⌘C 複製已選取的連結。')}
};
if(location.protocol==='file:')
  $('share').title='提醒：這個網頁目前是存在你電腦裡的檔案，要先放到網路上，別人才打得開分享連結';
$('land').onclick=()=>setShape(false);
$('port').onclick=()=>setShape(true);

$('load').onclick=()=>loadFb($('url').value);
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')loadFb($('url').value)});
document.addEventListener('paste',e=>{
  if(e.target===$('url'))return setTimeout(()=>loadFb($('url').value),0);
  const t=(e.clipboardData||window.clipboardData).getData('text');
  if(t){$('url').value=t;loadFb(t)}
});

$('file').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  clearStage();
  $('shape').classList.remove('on');
  objUrl=URL.createObjectURL(file);
  const vd=document.createElement('video');
  vd.src=objUrl;vd.controls=true;vd.playsInline=true;
  vd.setAttribute('playsinline','');vd.setAttribute('webkit-playsinline','');
  /* 關掉影片內建全螢幕，改用右下角按鈕，鏡像才不會消失 */
  vd.setAttribute('controlsList','nofullscreen');
  vd.disablePictureInPicture=true;
  flip.appendChild(vd);
  try{history.replaceState(null,'',location.href.split('?')[0])}catch{}
  say('已載入並鏡像：'+file.name+'（本機影片只在你的裝置上播放，無法分享連結）');
};

/* 全螢幕：對整個播放區，鏡像會保留；iPhone 不支援時改成鋪滿整頁 */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const isBig=()=>fsEl()===stage||stage.classList.contains('big');
function updateZoom(){
  const b=isBig();
  zoom.textContent=b?'⤡ 離開全螢幕':'⤢ 全螢幕';
  zoom.setAttribute('aria-label',b?'離開全螢幕':'全螢幕');
  setTimeout(buildFrame,120);
}
zoom.onclick=()=>{
  if(isBig()){
    if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    stage.classList.remove('big');updateZoom();return;
  }
  const req=stage.requestFullscreen||stage.webkitRequestFullscreen;
  if(req)Promise.resolve(req.call(stage)).catch(()=>{stage.classList.add('big');updateZoom()});
  else{stage.classList.add('big');updateZoom()}
};
document.addEventListener('fullscreenchange',updateZoom);
document.addEventListener('webkitfullscreenchange',updateZoom);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('big')){stage.classList.remove('big');updateZoom()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(buildFrame,250)});

/* 從分享連結打開：自動載入影片 */
(function(){
  const q=new URLSearchParams(location.search);
  const v=q.get('v');
  if(v){
    loadFb(v,q.get('s')==='p');
    say('這是分享給你的鏡像影片，按播放鍵即可觀看。');
  }
})();
</script>
</body>
</html>
